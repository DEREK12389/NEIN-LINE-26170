
name: NEIN Build Environment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: xcode-27

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check macOS
        run: sw_vers

      - name: Check Xcode
        run: xcodebuild -version

      - name: Check iOS SDK
        run: xcrun --sdk iphoneos --show-sdk-version

      - name: Check Build Tools
        run: |
          xcrun --find clang
          xcrun --find codesign

      - name: Check Python
        run: python3 --version

      - name: Check NEIN
        run: python3 tools/main.py --help
      - name: Compile CoreUI icon extractor
        run: |
          xcrun --sdk macosx clang \
            -fobjc-arc -fblocks \
            -framework AppKit \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            tools/extract_icon_previews.m \
            -o /tmp/extract_icon_previews
          test -f /tmp/extract_icon_previews
