name: NEIN Build Environment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: xcode-27

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check macOS
        run: sw_vers

      - name: Check Xcode
        run: xcodebuild -version

      - name: Check iOS SDK
        run: xcrun --sdk iphoneos --show-sdk-version

      - name: Check Build Tools
        run: |
          xcrun --find clang
          xcrun --find codesign

      - name: Check Python
        run: python3 --version

      - name: Check NEIN
        run: python3 tools/main.py --help

      - name: Compile CoreUI icon extractor
        run: |
          xcrun --sdk macosx clang \
            -fobjc-arc -fblocks \
            -framework AppKit \
            -framework ImageIO \
            -framework UniformTypeIdentifiers \
            tools/extract_icon_previews.m \
            -o /tmp/extract_icon_previews
          test -f /tmp/extract_icon_previews

      - name: Compile NEINHooks dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios18.0 \
            -isysroot "$SDK" \
            -fobjc-arc -fblocks -O2 -Wall -Wextra \
            -DNEIN_MULTI_ICON_PICKER=1 \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -Wl,-install_name,@executable_path/Frameworks/NEINHooks.dylib \
            hooks/NEINHooks.m \
            -o /tmp/NEINHooks.dylib

          codesign --force --sign - /tmp/NEINHooks.dylib
          codesign --verify --strict /tmp/NEINHooks.dylib